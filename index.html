<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 Cozy Cat Schedule 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5ebd9;
    --cream-light: #faf3e5;
    --teal: #7fbfc4;
    --teal-soft: #b5d8d9;
    --coral: #d68876;
    --coral-soft: #e8a896;
    --brown: #5a3a2a;
    --brown-light: #8b6b4f;
    --tan: #c4a87c;
    --text: #4a3220;
    --text-soft: #8b6b4f;
    --hour-line: rgba(91, 58, 42, 0.12);
    --half-line: rgba(91, 58, 42, 0.05);
    --hour-px: 56px;
  }

  body {
    font-family: 'Quicksand', -apple-system, sans-serif;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 15% 25%, var(--teal-soft) 0%, transparent 15%),
      radial-gradient(circle at 85% 75%, var(--coral-soft) 0%, transparent 18%),
      radial-gradient(circle at 50% 50%, var(--cream-light) 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  body::before, body::after {
    content: '';
    position: fixed;
    width: 100%;
    height: 12px;
    background-image:
      repeating-linear-gradient(90deg,
        var(--coral) 0 20px,
        var(--cream-light) 20px 40px,
        var(--teal) 40px 60px,
        var(--cream-light) 60px 80px);
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
  }
  body::before { top: 0; }
  body::after { bottom: 0; }

  .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 16px;
    background: rgba(255, 252, 245, 0.85);
    backdrop-filter: blur(10px);
    padding: 16px 24px;
    border-radius: 24px;
    box-shadow: 0 6px 24px rgba(91, 58, 42, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.9);
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-cat-img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--cream-light);
    box-shadow: 0 4px 12px rgba(91, 58, 42, 0.2);
  }
  h1 {
    font-family: 'Caveat', cursive;
    font-size: 36px;
    font-weight: 600;
    color: var(--brown);
    line-height: 1;
  }
  .draggable-paw {
    display: inline-block;
    cursor: grab;
    transition: transform 0.15s;
    user-select: none;
    -webkit-user-select: none;
  }
  .draggable-paw:hover {
    transform: scale(1.25) rotate(-12deg);
  }
  .draggable-paw.dragging {
    position: fixed !important;
    cursor: grabbing;
    z-index: 9999;
    transition: none;
    transform: scale(1.4) rotate(-8deg);
    filter: drop-shadow(0 4px 8px rgba(91, 58, 42, 0.4));
  }
  .trail-paw {
    position: fixed;
    font-size: 18px;
    pointer-events: none;
    z-index: 9998;
    animation: trail-fade 1.4s ease-out forwards;
  }
  @keyframes trail-fade {
    0%   { opacity: 0.8; }
    100% { opacity: 0; }
  }
  .paw-reset {
    display: inline-block;
    margin-left: 8px;
    font-size: 11px;
    color: var(--text-soft);
    cursor: pointer;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    text-decoration: underline dotted;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .paw-reset.visible { opacity: 1; }
  .week-range {
    color: var(--text-soft);
    font-size: 13px;
    margin-top: 4px;
    font-weight: 500;
  }
  .hint {
    color: var(--brown);
    font-size: 12px;
    margin-top: 6px;
    font-weight: 500;
    opacity: 0.75;
  }
  .hint kbd {
    display: inline-block;
    background: var(--cream-light);
    border: 1px solid rgba(91, 58, 42, 0.15);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 11px;
    font-family: inherit;
    font-weight: 600;
    color: var(--brown);
    margin: 0 2px;
  }
  .actions { display: flex; gap: 10px; }
  button {
    background: var(--coral);
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 18px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(214, 136, 118, 0.35);
  }
  button:hover {
    transform: translateY(-2px);
    background: #c97062;
    box-shadow: 0 6px 16px rgba(214, 136, 118, 0.45);
  }
  button.secondary {
    background: var(--teal);
    box-shadow: 0 4px 12px rgba(127, 191, 196, 0.35);
  }
  button.secondary:hover {
    background: #6aa9ae;
    box-shadow: 0 6px 16px rgba(127, 191, 196, 0.45);
  }
  button.outline {
    background: rgba(255, 252, 245, 0.85);
    color: var(--brown);
    border: 1.5px solid rgba(91, 58, 42, 0.18);
    box-shadow: 0 2px 6px rgba(91, 58, 42, 0.08);
  }
  button.outline:hover {
    background: white;
    box-shadow: 0 4px 10px rgba(91, 58, 42, 0.14);
  }

  /* Calendar grid */
  .calendar {
    background: rgba(255, 252, 245, 0.85);
    padding: 8px;
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(91, 58, 42, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.9);
  }
  .day-headers {
    display: grid;
    grid-template-columns: 60px repeat(5, 1fr);
    gap: 4px;
    margin-bottom: 18px;
  }
  .day-header {
    background: linear-gradient(135deg, var(--cream-light) 0%, #f0e3cb 100%);
    padding: 12px 10px;
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    border-radius: 12px;
    border: 2px solid rgba(255, 255, 255, 0.8);
  }
  .day-header .day-name { color: var(--brown); }
  .day-header .day-date {
    color: var(--text-soft);
    font-size: 11px;
    font-weight: 500;
    margin-top: 3px;
  }
  .day-header.today {
    background: linear-gradient(135deg, var(--coral) 0%, var(--coral-soft) 100%);
    box-shadow: 0 4px 12px rgba(214, 136, 118, 0.4);
  }
  .day-header.today .day-name,
  .day-header.today .day-date { color: white; }
  .day-header.time-corner {
    background: linear-gradient(135deg, var(--coral-soft) 0%, var(--coral) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: white;
  }

  .body-grid {
    display: grid;
    grid-template-columns: 60px repeat(5, 1fr);
    gap: 4px;
    position: relative;
  }
  .time-column {
    position: relative;
  }
  .time-mark {
    position: absolute;
    right: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-soft);
    transform: translateY(-50%);
    background: var(--cream-light);
    padding: 1px 6px;
    border-radius: 6px;
  }
  .day-column {
    position: relative;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    cursor: crosshair;
    border: 2px solid rgba(255, 255, 255, 0.8);
  }
  .day-column.today {
    background: linear-gradient(180deg, #fff4ee 0%, #fff8f3 100%);
    box-shadow: inset 3px 0 0 var(--coral);
  }

  .hour-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--hour-line);
    pointer-events: none;
  }
  .half-line {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--half-line);
    pointer-events: none;
  }

  /* Paws shown when day column is empty */
  .paws {
    position: absolute;
    inset: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .paws.hidden { opacity: 0; }
  .paw {
    position: absolute;
    font-size: 22px;
    opacity: 0.35;
    animation: paw-float 4s ease-in-out infinite;
  }
  @keyframes paw-float {
    0%, 100% { transform: rotate(var(--rot, 0deg)) translateY(0); }
    50% { transform: rotate(var(--rot, 0deg)) translateY(-4px); }
  }

  /* Event card */
  .event {
    position: absolute;
    left: 4px;
    right: 4px;
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    cursor: pointer;
    border: 1.5px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 2px 6px rgba(91, 58, 42, 0.1);
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: transform 0.15s, box-shadow 0.15s;
    user-select: none;
  }
  .event:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 10px rgba(91, 58, 42, 0.18);
    z-index: 10;
  }
  .event .event-top {
    display: flex;
    align-items: center;
    gap: 4px;
    line-height: 1.2;
  }
  .event .event-emoji { font-size: 13px; }
  .event .event-time {
    font-size: 10px;
    font-weight: 600;
    opacity: 0.65;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .event .event-delete {
    position: absolute;
    top: 2px;
    right: 4px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.8);
    color: var(--brown);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .event:hover .event-delete { opacity: 1; }
  /* Touch devices: always show delete since there's no hover */
  @media (hover: none) {
    .event .event-delete { opacity: 0.85; }
  }
  .event[contenteditable="true"] { outline: 2px solid var(--coral); }

  .event.work    { background: linear-gradient(135deg, #d4e8ea 0%, #b8d8dc 100%); }
  .event.sleep   { background: linear-gradient(135deg, #e0d4f5 0%, #c8b8e8 100%); }
  .event.exercise { background: linear-gradient(135deg, #d0e8c0 0%, #b8d8a0 100%); }
  .event.cat     { background: linear-gradient(135deg, #ffd4b0 0%, #ffbf90 100%); }
  .event.hobby   { background: linear-gradient(135deg, #ffd4d6 0%, #ffb8bc 100%); }
  .event.study   { background: linear-gradient(135deg, #ecc4b8 0%, #e0aa9a 100%); }
  .event.chore   { background: linear-gradient(135deg, #c8e8e0 0%, #a8d8cc 100%); }
  .event.free    { background: linear-gradient(135deg, #fae3b8 0%, #f5d495 100%); }

  /* Ghost (drag preview) */
  .drag-ghost {
    position: absolute;
    left: 4px;
    right: 4px;
    background: rgba(214, 136, 118, 0.4);
    border: 2px dashed var(--coral);
    border-radius: 8px;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--brown);
    z-index: 5;
  }

  /* Task selector chips */
  .task-selector {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
    background: rgba(255, 252, 245, 0.7);
    padding: 10px;
    border-radius: 18px;
    border: 2px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 4px 14px rgba(91, 58, 42, 0.08);
  }
  .task-chip {
    background: white;
    color: var(--text);
    border: 2px solid transparent;
    padding: 7px 12px;
    border-radius: 14px;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    line-height: 1;
    box-shadow: 0 2px 6px rgba(91, 58, 42, 0.08);
  }
  .task-chip:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(91, 58, 42, 0.14); }
  .task-chip.selected {
    border-color: var(--brown);
    box-shadow: 0 4px 12px rgba(90, 58, 42, 0.25);
    transform: translateY(-1px);
  }
  .task-chip .task-emoji { font-size: 16px; }
  /* Task picker modal (opens when clicking an event) */
  .task-picker {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .task-picker.active { display: flex; }
  .task-picker-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(74, 50, 32, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .task-picker-modal {
    position: relative;
    background: white;
    border-radius: 22px;
    padding: 18px 16px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 16px 48px rgba(91, 58, 42, 0.3);
    animation: pop-in 0.18s ease-out;
  }
  @keyframes pop-in {
    from { transform: scale(0.92); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .task-picker-header {
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--brown);
    text-align: center;
    margin-bottom: 6px;
  }
  .task-picker-sub {
    text-align: center;
    color: var(--text-soft);
    font-size: 11px;
    margin-bottom: 14px;
    font-weight: 600;
  }
  .task-picker-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .task-picker-grid .task-chip {
    width: 100%;
    justify-content: flex-start;
    padding: 9px 12px;
  }
  .task-picker-close {
    position: absolute;
    top: 8px;
    right: 10px;
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text-soft);
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    box-shadow: none;
  }
  .task-picker-close:hover { color: var(--brown); background: none; }

  .task-chip.work     { background: linear-gradient(135deg, #d4e8ea 0%, #b8d8dc 100%); }
  .task-chip.sleep    { background: linear-gradient(135deg, #e0d4f5 0%, #c8b8e8 100%); }
  .task-chip.exercise { background: linear-gradient(135deg, #d0e8c0 0%, #b8d8a0 100%); }
  .task-chip.cat      { background: linear-gradient(135deg, #ffd4b0 0%, #ffbf90 100%); }
  .task-chip.hobby    { background: linear-gradient(135deg, #ffd4d6 0%, #ffb8bc 100%); }
  .task-chip.study    { background: linear-gradient(135deg, #ecc4b8 0%, #e0aa9a 100%); }
  .task-chip.chore    { background: linear-gradient(135deg, #c8e8e0 0%, #a8d8cc 100%); }
  .task-chip.free     { background: linear-gradient(135deg, #fae3b8 0%, #f5d495 100%); }

  .cat-hero {
    margin-top: 18px;
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    height: 160px;
    box-shadow: 0 8px 24px rgba(91, 58, 42, 0.18);
    border: 2px solid rgba(255, 255, 255, 0.9);
  }
  .cat-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 40%;
  }
  .cat-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(74, 50, 32, 0.7) 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 20px;
  }
  .cat-hero-text {
    color: white;
    font-family: 'Caveat', cursive;
    font-size: 26px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    text-align: center;
  }

  .footer {
    text-align: center;
    margin-top: 14px;
    color: var(--text-soft);
    font-family: 'Caveat', cursive;
    font-size: 20px;
  }

  @media (max-width: 768px) {
    :root { --hour-px: 60px; }
    body { padding: 10px; }
    .calendar {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px;
    }
    .day-headers, .body-grid {
      grid-template-columns: 44px repeat(5, 80px);
      gap: 3px;
      width: max-content;
      min-width: 100%;
    }
    .day-header.time-corner,
    .time-column {
      position: sticky;
      left: 0;
      z-index: 5;
    }
    .time-column { background: rgba(255, 252, 245, 0.95); }
    h1 { font-size: 22px; }
    header { padding: 10px 14px; gap: 8px; margin-bottom: 12px; flex-wrap: nowrap; align-items: flex-start; }
    .header-cat-img { width: 44px; height: 44px; border-width: 2px; }
    .header-left { gap: 10px; flex: 1; min-width: 0; }
    .week-range { font-size: 11px; margin-top: 2px; }
    .hint { font-size: 11px; line-height: 1.5; margin-top: 5px; }
    .hint kbd { font-size: 10px; padding: 0px 5px; }
    .actions { flex-direction: column; gap: 6px; flex-shrink: 0; }
    .day-header { padding: 8px 2px; font-size: 11px; }
    .day-header .day-date { font-size: 9px; }
    .day-header.time-corner { font-size: 16px; }
    .time-mark { font-size: 10px; padding: 1px 4px; right: 3px; font-weight: 700; }
    .event {
      font-size: 11px;
      padding: 4px 5px;
      left: 2px;
      right: 2px;
      gap: 1px;
    }
    .event .event-emoji { font-size: 12px; }
    .event .event-task { line-height: 1.2; }
    .event .event-time { font-size: 9px; }
    .event[data-short] .event-time { display: none; }
    .event[data-short] .event-top { line-height: 1.15; }
    .event[data-short] .event-task {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .event .event-delete { width: 22px; height: 22px; font-size: 14px; top: 3px; right: 3px; }
    .paw { font-size: 18px; }
    .task-selector { padding: 8px; gap: 5px; margin-bottom: 10px; border-radius: 14px; }
    .task-chip { padding: 6px 10px; font-size: 11px; border-radius: 12px; gap: 4px; }
    .task-chip .task-emoji { font-size: 14px; }
    button { padding: 8px 12px; font-size: 11px; border-radius: 14px; }
    .legend { gap: 8px; font-size: 11px; padding: 10px 14px; }
    .cat-hero { height: 110px; margin-top: 14px; }
    .cat-hero-text { font-size: 18px; }
    .footer { font-size: 16px; margin-top: 10px; }
  }

  /* Print — only the table, one page */
  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    html, body {
      background: white !important;
      padding: 0 !important;
      margin: 0 !important;
      color: #1a1a1a !important;
      width: 100% !important;
      height: 100% !important;
    }
    body::before, body::after, .floating-cat,
    header, .task-selector, .cat-hero, .footer, .paws { display: none !important; }

    .container { max-width: 100%; padding: 0 !important; margin: 0 !important; }

    .calendar {
      background: white !important;
      padding: 0 !important;
      box-shadow: none !important;
      border: 1.5px solid #333 !important;
      overflow: visible !important;
      page-break-inside: avoid;
      margin: 0 !important;
    }
    .day-headers, .body-grid {
      grid-template-columns: 42px repeat(5, 1fr) !important;
      gap: 0 !important;
      width: 100% !important;
      min-width: 0 !important;
      margin-bottom: 0 !important;
    }
    .day-header {
      background: #f0f0f0 !important;
      color: #1a1a1a !important;
      border: 1px solid #999 !important;
      border-radius: 0 !important;
      padding: 4px 4px !important;
      box-shadow: none !important;
      font-size: 11px !important;
    }
    .day-header.today { background: #ddd !important; }
    .day-header .day-name, .day-header .day-date { color: #1a1a1a !important; }
    .day-header .day-date { font-size: 9px !important; margin-top: 1px !important; }
    .day-header.time-corner {
      background: #e8e8e8 !important;
      color: #333 !important;
      font-size: 12px !important;
    }
    .time-column { position: static !important; background: white !important; }
    .time-mark {
      background: white !important;
      color: #333 !important;
      font-size: 9px !important;
      padding: 0 3px !important;
    }
    .day-column {
      background: white !important;
      border: 1px solid #ccc !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      position: relative !important;
    }
    .day-column.today { background: #fafafa !important; box-shadow: inset 2px 0 0 #555 !important; }
    .hour-line { background: rgba(0,0,0,0.18) !important; }
    .half-line { background: rgba(0,0,0,0.06) !important; }
    .event {
      border: 1px solid #888 !important;
      border-radius: 3px !important;
      box-shadow: none !important;
      color: #111 !important;
      font-size: 8px !important;
      padding: 1px 3px !important;
      page-break-inside: avoid;
      left: 1px !important;
      right: 1px !important;
    }
    .event.work    { background: #d4e8ea !important; }
    .event.sleep   { background: #e0d4f5 !important; }
    .event.exercise { background: #d0e8c0 !important; }
    .event.cat     { background: #ffd4b0 !important; }
    .event.hobby   { background: #ffd4d6 !important; }
    .event.study   { background: #ecc4b8 !important; }
    .event.chore   { background: #c8e8e0 !important; }
    .event.free    { background: #fae3b8 !important; }
    .event .event-emoji { font-size: 9px !important; }
    .event .event-time { font-size: 8px !important; opacity: 0.85 !important; color: #333 !important; }
    .event .event-delete { display: none !important; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-left">
      <img src="cat-petting.png" alt="cozy cat" class="header-cat-img">
      <div>
        <h1>my cozy week <span class="draggable-paw" id="draggablePaw">🐾</span></h1>
        <div class="week-range" id="weekRange"></div>
        <div class="hint">pick a task ↓ then <kbd>drag</kbd> empty time · tap a block to <kbd>change</kbd> · <kbd>×</kbd> to delete<span class="paw-reset" id="pawReset">put paw back</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="outline" id="printBtn" title="Print this week">🖨️ Print</button>
      <button class="secondary" id="clearBtn">🐾 Clear</button>
      <button id="generateBtn">✨ Generate</button>
    </div>
  </header>

  <div class="task-selector" id="taskSelector"></div>

  <div class="calendar">
    <div class="day-headers" id="dayHeaders"></div>
    <div class="body-grid">
      <div class="time-column" id="timeColumn"></div>
      <div class="day-column" data-day="0"></div>
      <div class="day-column" data-day="1"></div>
      <div class="day-column" data-day="2"></div>
      <div class="day-column" data-day="3"></div>
      <div class="day-column" data-day="4"></div>
    </div>
  </div>

  <div class="cat-hero">
    <img src="cats-sleeping.png" alt="sleeping cats together">
    <div class="cat-hero-overlay">
      <div class="cat-hero-text">stay cozy this week 🐾 you've got this</div>
    </div>
  </div>

  <div class="footer">made with 🐾 love 🐾 & lots of naps</div>
</div>

<div class="task-picker" id="taskPicker" role="dialog" aria-modal="true">
  <div class="task-picker-backdrop" data-close></div>
  <div class="task-picker-modal">
    <button class="task-picker-close" data-close type="button" aria-label="close">×</button>
    <div class="task-picker-header">change task 🐾</div>
    <div class="task-picker-sub">pick what this block should be</div>
    <div class="task-picker-grid" id="taskPickerGrid"></div>
  </div>
</div>

<script>
  // ===== Constants =====
  const START_HOUR = 7;
  const END_HOUR = 23;
  const TOTAL_HOURS = END_HOUR - START_HOUR; // 16
  const TOTAL_MIN = TOTAL_HOURS * 60;        // 960
  const SNAP_MIN = 30;
  const MIN_EVENT_MIN = 30;
  const DAYS = [
    { name: "Mon", emoji: "🌿" },
    { name: "Tue", emoji: "☕" },
    { name: "Wed", emoji: "🌸" },
    { name: "Thu", emoji: "🍂" },
    { name: "Fri", emoji: "🌙" },
  ];

  function getHourPx() {
    return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hour-px'));
  }
  function pxPerMin() { return getHourPx() / 60; }

  // ===== State =====
  const STORAGE_KEY = 'nyangee-diary-v1';
  let events = [];
  let nextId = 1;

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        events,
        nextId,
        selectedTaskId: typeof selectedTask !== 'undefined' && selectedTask ? selectedTask.id : null,
      }));
    } catch (e) { /* quota / disabled — ignore */ }
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.events)) return null;
      // Sanity-check each event
      data.events = data.events.filter(ev =>
        ev && typeof ev.day === 'number' && typeof ev.startMin === 'number' &&
        typeof ev.endMin === 'number' && ev.endMin > ev.startMin &&
        typeof ev.task === 'string' && typeof ev.category === 'string'
      );
      return data;
    } catch (e) { return null; }
  }

  // 8 selectable tasks — user picks one, then drags time
  const TASKS = [
    { id: 'work',      label: 'work',                 emoji: '💼', category: 'work' },
    { id: 'sleep',     label: 'sleep',                emoji: '😴', category: 'sleep' },
    { id: 'exercise',  label: 'exercise',             emoji: '🏋️', category: 'exercise' },
    { id: 'cat',       label: 'play with cat',        emoji: '🐱', category: 'cat' },
    { id: 'hobby',     label: 'personal hobby',       emoji: '🎨', category: 'hobby' },
    { id: 'develop',   label: 'personal development', emoji: '📚', category: 'study' },
    { id: 'cleaning',  label: 'house cleaning',       emoji: '🧹', category: 'chore' },
    { id: 'ding',      label: '딩똥빵 시간',          emoji: '🎲', category: 'free' },
  ];
  let selectedTask = TASKS[0];

  function buildTaskSelector() {
    const wrap = document.getElementById('taskSelector');
    wrap.innerHTML = '';
    TASKS.forEach(t => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = `task-chip ${t.category}`;
      chip.dataset.taskId = t.id;
      if (t.id === selectedTask.id) chip.classList.add('selected');
      chip.innerHTML = `<span class="task-emoji">${t.emoji}</span><span class="task-label">${t.label}</span>`;
      chip.addEventListener('click', () => selectTask(t));
      wrap.appendChild(chip);
    });
  }
  function selectTask(t) {
    selectedTask = t;
    document.querySelectorAll('.task-chip').forEach(c => {
      c.classList.toggle('selected', c.dataset.taskId === t.id);
    });
    saveState();
  }

  // ===== Date helpers =====
  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0, 0, 0, 0);
    return date;
  }
  function formatDate(d) { return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
  function ymd(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function formatHour(h) {
    if (h === 12) return "12pm";
    if (h === 0) return "12am";
    return h < 12 ? `${h}am` : `${h - 12}pm`;
  }
  function minToTimeStr(m) {
    const total = START_HOUR * 60 + m;
    const h = Math.floor(total / 60);
    const min = total % 60;
    const ampm = h < 12 ? 'am' : 'pm';
    const dispH = h === 0 ? 12 : h > 12 ? h - 12 : h;
    return `${dispH}:${min.toString().padStart(2,'0')}${ampm}`;
  }

  // ===== Build static parts =====
  function buildDayHeaders() {
    const wrap = document.getElementById("dayHeaders");
    wrap.innerHTML = "";

    const corner = document.createElement("div");
    corner.className = "day-header time-corner";
    corner.textContent = "🐾";
    wrap.appendChild(corner);

    const monday = getMonday(new Date());
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    DAYS.forEach((day, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      const header = document.createElement("div");
      header.className = "day-header";
      if (d.getTime() === today.getTime()) {
        header.classList.add("today");
        document.querySelector(`.day-column[data-day="${i}"]`).classList.add("today");
      }
      header.innerHTML = `<div class="day-name">${day.emoji} ${day.name}</div><div class="day-date">${formatDate(d)}</div>`;
      wrap.appendChild(header);
    });

    const friday = new Date(monday);
    friday.setDate(monday.getDate() + 4);
    document.getElementById("weekRange").textContent =
      `${formatDate(monday)} – ${formatDate(friday)}, ${monday.getFullYear()}`;
  }

  function buildTimeColumn() {
    const col = document.getElementById("timeColumn");
    col.innerHTML = "";
    col.style.height = (TOTAL_HOURS * getHourPx()) + "px";
    for (let h = 0; h <= TOTAL_HOURS; h++) {
      const mark = document.createElement("div");
      mark.className = "time-mark";
      mark.textContent = formatHour(START_HOUR + h);
      mark.style.top = (h * getHourPx()) + "px";
      col.appendChild(mark);
    }
  }

  function buildDayColumns() {
    document.querySelectorAll(".day-column").forEach(col => {
      col.innerHTML = "";
      col.style.height = (TOTAL_HOURS * getHourPx()) + "px";
      // Hour grid lines
      for (let h = 0; h <= TOTAL_HOURS; h++) {
        const line = document.createElement("div");
        line.className = "hour-line";
        line.style.top = (h * getHourPx()) + "px";
        col.appendChild(line);
        if (h < TOTAL_HOURS) {
          const half = document.createElement("div");
          half.className = "half-line";
          half.style.top = (h * getHourPx() + getHourPx()/2) + "px";
          col.appendChild(half);
        }
      }
      // Paws (shown when empty)
      const paws = document.createElement("div");
      paws.className = "paws";
      const pawPositions = [
        { t: 8,  l: 18, r: -18 },
        { t: 22, l: 65, r: 12  },
        { t: 38, l: 28, r: 8   },
        { t: 52, l: 70, r: -10 },
        { t: 68, l: 22, r: 18  },
        { t: 82, l: 60, r: -22 },
        { t: 92, l: 35, r: 10  },
      ];
      pawPositions.forEach(p => {
        const paw = document.createElement("span");
        paw.className = "paw";
        paw.textContent = "🐾";
        paw.style.top = p.t + "%";
        paw.style.left = p.l + "%";
        paw.style.setProperty('--rot', p.r + 'deg');
        paws.appendChild(paw);
      });
      col.appendChild(paws);
    });
  }

  function updatePawsVisibility() {
    document.querySelectorAll(".day-column").forEach(col => {
      const day = parseInt(col.dataset.day);
      const has = events.some(ev => ev.day === day);
      const paws = col.querySelector(".paws");
      if (paws) paws.classList.toggle("hidden", has);
    });
  }

  // ===== Events render =====
  function renderEvents() {
    // Remove all event cards (use calendar-wide selector so nothing slips through)
    document.querySelectorAll(".calendar .event").forEach(e => e.remove());

    const ppm = pxPerMin();
    events.forEach(ev => {
      const col = document.querySelector(`.day-column[data-day="${ev.day}"]`);
      if (!col) return;
      const el = document.createElement("div");
      el.className = `event ${ev.category}`;
      el.dataset.id = ev.id;
      el.style.top = (ev.startMin * ppm) + "px";
      el.style.height = ((ev.endMin - ev.startMin) * ppm) + "px";
      if ((ev.endMin - ev.startMin) <= 30) el.dataset.short = "1";
      el.innerHTML = `
        <div class="event-top"><span class="event-emoji">${ev.emoji}</span><span class="event-task">${escapeHtml(ev.task)}</span></div>
        <div class="event-time">${minToTimeStr(ev.startMin)} – ${minToTimeStr(ev.endMin)}</div>
        <span class="event-delete" data-action="delete">×</span>
      `;
      col.appendChild(el);
    });
    updatePawsVisibility();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ===== Drag to create =====
  let dragState = null;

  function getEventY(e, col) {
    const rect = col.getBoundingClientRect();
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return Math.max(0, Math.min(col.offsetHeight, cy - rect.top));
  }
  function snapMin(min) {
    return Math.max(0, Math.min(TOTAL_MIN, Math.round(min / SNAP_MIN) * SNAP_MIN));
  }

  function startDrag(e, col) {
    if (e.target.closest(".event")) return;
    // For mouse: preventDefault now. For touch: defer until vertical intent confirmed.
    const isTouch = !!(e.touches && e.touches[0]);
    if (!isTouch) e.preventDefault();
    const y = getEventY(e, col);
    const startX = isTouch ? e.touches[0].clientX : e.clientX;
    const startY = isTouch ? e.touches[0].clientY : e.clientY;
    const m = snapMin(y / pxPerMin());
    dragState = {
      col, day: parseInt(col.dataset.day),
      startMin: m, currentMin: m,
      startX, startY,
      confirmed: !isTouch, // mouse drag is immediately confirmed
      ghost: null,
      isTouch
    };
    if (!isTouch) {
      const ghost = document.createElement("div");
      ghost.className = "drag-ghost";
      col.appendChild(ghost);
      dragState.ghost = ghost;
      updateGhost();
    }
  }
  function updateGhost() {
    if (!dragState || !dragState.ghost) return;
    const a = Math.min(dragState.startMin, dragState.currentMin);
    const b = Math.max(dragState.startMin, dragState.currentMin);
    const ppm = pxPerMin();
    dragState.ghost.style.top = (a * ppm) + "px";
    dragState.ghost.style.height = Math.max(MIN_EVENT_MIN * ppm, (b - a) * ppm) + "px";
    dragState.ghost.textContent = `${minToTimeStr(a)} – ${minToTimeStr(Math.max(b, a + MIN_EVENT_MIN))}`;
  }
  function moveDrag(e) {
    if (!dragState) return;
    const isTouch = !!(e.touches && e.touches[0]);
    // Detect intent on first touch movement to allow horizontal scroll
    if (isTouch && !dragState.confirmed) {
      const cx = e.touches[0].clientX;
      const cy = e.touches[0].clientY;
      const dx = Math.abs(cx - dragState.startX);
      const dy = Math.abs(cy - dragState.startY);
      if (dx < 6 && dy < 6) return; // ignore tiny movements
      if (dx > dy) {
        // Horizontal pan — let the calendar scroll, abandon drag
        dragState = null;
        return;
      }
      // Vertical drag confirmed
      dragState.confirmed = true;
      const ghost = document.createElement("div");
      ghost.className = "drag-ghost";
      dragState.col.appendChild(ghost);
      dragState.ghost = ghost;
    }
    if (!dragState.confirmed) return;
    e.preventDefault();
    const y = getEventY(e, dragState.col);
    dragState.currentMin = snapMin(y / pxPerMin());
    updateGhost();
  }
  function endDrag(e) {
    if (!dragState) return;
    // Touch tap without confirmed vertical drag → don't create event
    if (dragState.isTouch && !dragState.confirmed) {
      dragState = null;
      return;
    }
    const a = Math.min(dragState.startMin, dragState.currentMin);
    let b = Math.max(dragState.startMin, dragState.currentMin);
    if (b - a < MIN_EVENT_MIN) b = Math.min(TOTAL_MIN, a + 60); // single click = 1hr default
    const startMin = a;
    const endMin = b;
    const day = dragState.day;
    if (dragState.ghost) dragState.ghost.remove();
    dragState = null;
    // Use the currently selected task chip
    events.push({
      id: nextId++, day, startMin, endMin,
      task: selectedTask.label,
      category: selectedTask.category,
      emoji: selectedTask.emoji
    });
    renderEvents();
    saveState();
  }

  function bindColumnDrag(col) {
    col.addEventListener("mousedown", e => startDrag(e, col));
    col.addEventListener("touchstart", e => startDrag(e, col), { passive: false });
  }

  // ===== Event click — × deletes, body click opens the task picker =====
  let editingEventId = null;

  function openTaskPicker(eventId) {
    editingEventId = eventId;
    const grid = document.getElementById('taskPickerGrid');
    grid.innerHTML = '';
    const ev = events.find(e => e.id === eventId);
    TASKS.forEach(t => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = `task-chip ${t.category}`;
      if (ev && ev.category === t.category && ev.task === t.label) chip.classList.add('selected');
      chip.innerHTML = `<span class="task-emoji">${t.emoji}</span><span class="task-label">${t.label}</span>`;
      chip.addEventListener('click', () => applyTaskToEvent(t));
      grid.appendChild(chip);
    });
    document.getElementById('taskPicker').classList.add('active');
  }
  function applyTaskToEvent(t) {
    const ev = events.find(e => e.id === editingEventId);
    if (ev) {
      ev.task = t.label;
      ev.category = t.category;
      ev.emoji = t.emoji;
      renderEvents();
      saveState();
    }
    closeTaskPicker();
  }
  function closeTaskPicker() {
    document.getElementById('taskPicker').classList.remove('active');
    editingEventId = null;
  }

  function bindEventClicks() {
    document.addEventListener("click", e => {
      // Close picker on backdrop / × click
      if (e.target.dataset.close !== undefined) {
        closeTaskPicker();
        return;
      }
      // Ignore clicks inside the picker modal (the chips handle themselves)
      if (e.target.closest('.task-picker-modal')) return;

      const eventEl = e.target.closest(".event");
      if (!eventEl) return;
      const id = parseInt(eventEl.dataset.id);
      if (e.target.dataset.action === "delete") {
        events = events.filter(ev => ev.id !== id);
        renderEvents();
        saveState();
        return;
      }
      openTaskPicker(id);
    });
    // ESC to close
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeTaskPicker();
    });
  }

  // ===== Sample week (Generate) — fills each weekday with a default routine using the 8 tasks =====
  const SAMPLE_DAY = [
    [0,   60,  'cleaning'], //  7:00 - 8:00 morning routine
    [60,  120, 'work'],     //  8:00 - 9:00
    [120, 300, 'work'],     //  9:00 - 12:00
    [300, 360, 'ding'],     // 12:00 - 13:00 lunch break
    [360, 600, 'work'],     // 13:00 - 17:00
    [600, 660, 'exercise'], // 17:00 - 18:00
    [660, 720, 'cleaning'], // 18:00 - 19:00 dinner prep
    [720, 840, 'cat'],      // 19:00 - 21:00 cat time
    [840, 900, 'hobby'],    // 21:00 - 22:00
    [900, 960, 'sleep'],    // 22:00 - 23:00 wind down
  ];

  function generateWeek() {
    events = [];
    nextId = 1;
    for (let day = 0; day < 5; day++) {
      SAMPLE_DAY.forEach(([s, e, taskId]) => {
        const t = TASKS.find(x => x.id === taskId);
        if (!t) return;
        events.push({
          id: nextId++, day, startMin: s, endMin: e,
          task: t.label, category: t.category, emoji: t.emoji
        });
      });
    }
    renderEvents();
    saveState();
  }

  function clearAll() {
    events = [];
    // Cancel any in-progress drag so its ghost gets cleaned up
    if (dragState) {
      if (dragState.ghost) dragState.ghost.remove();
      dragState = null;
    }
    // Defensive: remove any stray event cards or drag-ghosts left over from interrupted interactions
    document.querySelectorAll(".calendar .event, .calendar .drag-ghost").forEach(el => el.remove());
    renderEvents();
    saveState();
  }

  // ===== Draggable paw =====
  function initDraggablePaw() {
    const paw = document.getElementById("draggablePaw");
    const resetBtn = document.getElementById("pawReset");
    const homeParent = paw.parentNode;
    let dragging = false;
    let offX = 0, offY = 0;
    let lastTrail = 0;
    let movedDuringDrag = false;

    function pointerXY(e) {
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function spawnTrailPaw(x, y) {
      const t = document.createElement("span");
      t.className = "trail-paw";
      t.textContent = "🐾";
      const jitterX = (Math.random() * 14) - 7;
      const jitterY = (Math.random() * 14) - 7;
      const rot = (Math.random() * 80) - 40;
      t.style.left = (x - 10 + jitterX) + "px";
      t.style.top = (y - 10 + jitterY) + "px";
      t.style.transform = `rotate(${rot}deg)`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 1400);
    }

    function onDown(e) {
      e.preventDefault();
      const { x, y } = pointerXY(e);
      const rect = paw.getBoundingClientRect();
      offX = x - rect.left;
      offY = y - rect.top;
      paw.classList.add("dragging");
      paw.style.left = rect.left + "px";
      paw.style.top = rect.top + "px";
      dragging = true;
      movedDuringDrag = false;
    }
    function onMove(e) {
      if (!dragging) return;
      e.preventDefault();
      const { x, y } = pointerXY(e);
      paw.style.left = (x - offX) + "px";
      paw.style.top = (y - offY) + "px";
      movedDuringDrag = true;
      const now = performance.now();
      if (now - lastTrail > 70) {
        spawnTrailPaw(x, y);
        lastTrail = now;
      }
    }
    function onUp() {
      if (!dragging) return;
      dragging = false;
      if (movedDuringDrag) resetBtn.classList.add("visible");
    }

    paw.addEventListener("mousedown", onDown);
    paw.addEventListener("touchstart", onDown, { passive: false });
    document.addEventListener("mousemove", onMove);
    document.addEventListener("touchmove", onMove, { passive: false });
    document.addEventListener("mouseup", onUp);
    document.addEventListener("touchend", onUp);

    resetBtn.addEventListener("click", () => {
      paw.classList.remove("dragging");
      paw.style.left = "";
      paw.style.top = "";
      resetBtn.classList.remove("visible");
    });
  }

  // ===== Init =====
  function init() {
    buildTaskSelector();
    buildDayHeaders();
    buildTimeColumn();
    buildDayColumns();
    document.querySelectorAll(".day-column").forEach(bindColumnDrag);
    document.addEventListener("mousemove", moveDrag);
    document.addEventListener("mouseup", endDrag);
    document.addEventListener("touchmove", moveDrag, { passive: false });
    document.addEventListener("touchend", endDrag);
    bindEventClicks();
    document.getElementById("generateBtn").addEventListener("click", generateWeek);
    document.getElementById("clearBtn").addEventListener("click", clearAll);
    document.getElementById("printBtn").addEventListener("click", () => window.print());
    initDraggablePaw();

    // Print sizing — compress hour height so the whole table fits one A4 landscape page
    let savedHourPx = null;
    function rebuildForPrint(hourPx) {
      document.documentElement.style.setProperty('--hour-px', hourPx);
      buildTimeColumn();
      buildDayColumns();
      document.querySelectorAll(".day-column").forEach(bindColumnDrag);
      renderEvents();
    }
    window.addEventListener("beforeprint", () => {
      savedHourPx = getComputedStyle(document.documentElement).getPropertyValue('--hour-px').trim() || '56px';
      rebuildForPrint('38px');
    });
    window.addEventListener("afterprint", () => {
      document.documentElement.style.removeProperty('--hour-px');
      buildTimeColumn();
      buildDayColumns();
      document.querySelectorAll(".day-column").forEach(bindColumnDrag);
      renderEvents();
      savedHourPx = null;
    });

    // Load saved schedule (or start blank). Never auto-generate on first visit.
    const saved = loadState();
    if (saved) {
      events = saved.events;
      nextId = (saved.nextId && Number.isFinite(saved.nextId))
        ? saved.nextId
        : (events.reduce((m, e) => Math.max(m, e.id || 0), 0) + 1);
      if (saved.selectedTaskId) {
        const t = TASKS.find(x => x.id === saved.selectedTaskId);
        if (t) selectTask(t);
      }
    }
    renderEvents();

    // Keep dates fresh: poll every minute and rebuild the header row + paws
    // if either the current Monday or today's date has changed. Cheap operation.
    let lastMondayKey = ymd(getMonday(new Date()));
    let lastTodayKey  = ymd(new Date());
    setInterval(() => {
      const m = ymd(getMonday(new Date()));
      const t = ymd(new Date());
      if (m !== lastMondayKey || t !== lastTodayKey) {
        lastMondayKey = m;
        lastTodayKey  = t;
        buildDayHeaders();
        // Re-tag the matching day-column as today
        document.querySelectorAll(".day-column").forEach(c => c.classList.remove("today"));
        const today = new Date(); today.setHours(0,0,0,0);
        const mon = getMonday(new Date());
        const dayIdx = Math.round((today - mon) / 86400000);
        if (dayIdx >= 0 && dayIdx <= 4) {
          const col = document.querySelector(`.day-column[data-day="${dayIdx}"]`);
          if (col) col.classList.add("today");
        }
      }
    }, 60_000);
    // Also: when the tab regains focus (e.g. user comes back next morning) — refresh immediately
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        const m = ymd(getMonday(new Date()));
        const t = ymd(new Date());
        if (m !== lastMondayKey || t !== lastTodayKey) {
          lastMondayKey = m;
          lastTodayKey  = t;
          buildDayHeaders();
          document.querySelectorAll(".day-column").forEach(c => c.classList.remove("today"));
          const today = new Date(); today.setHours(0,0,0,0);
          const mon = getMonday(new Date());
          const dayIdx = Math.round((today - mon) / 86400000);
          if (dayIdx >= 0 && dayIdx <= 4) {
            const col = document.querySelector(`.day-column[data-day="${dayIdx}"]`);
            if (col) col.classList.add("today");
          }
        }
      }
    });

    // Rebuild on resize (hour-px may change)
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        buildTimeColumn();
        buildDayColumns();
        document.querySelectorAll(".day-column").forEach(bindColumnDrag);
        renderEvents();
      }, 150);
    });
  }

  init();
</script>
</body>
</html>
